<!DOCTYPE html>
<html>
<head>
    <title>貨幣轉換</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>***台幣換他國貨幣***</h1>
        
        <div class="input-group">
            <label>台幣金額:</label>
            <input type="text" id="amount" placeholder="輸入台幣金額">
            
            <label>轉換成:</label>
            <select id="currency">
                <option value="USD">美元</option>
                <option value="JPY">日圓</option>
                <option value="EUR">歐元</option>
                <option value="GBP">英鎊</option>
                <option value="CNY">人民幣</option>
            </select>
            
            <button onclick="convertCurrency()">轉換</button>
        </div>
        
        <div id="result"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
